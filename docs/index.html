<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="0; url=visualizations/standard-workflow.html">
<title>正在进入 · 多仓 Worktree 标准开发流程</title>
<style>
:root{color-scheme:dark;--bg:#08111f;--ink:#edf4ff;--muted:#a6bad3;--cyan:#6ee7db}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 80% 0,#15354c66,transparent 60%),var(--bg);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{width:min(620px,86vw);padding:44px;border:1px solid #29415e;border-radius:24px;background:#101e31;box-shadow:0 24px 80px #0004}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase;margin:0 0 16px}
h1{font-size:clamp(28px,5vw,44px);line-height:1.2;letter-spacing:-.03em;margin:0 0 12px}
p{color:var(--muted);margin:10px 0}
a{color:var(--cyan);text-underline-offset:3px}
.track{height:4px;margin-top:24px;border-radius:99px;background:#24364b;overflow:hidden}
.track span{display:block;width:42%;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),#86b9ff);animation:progress 1.1s ease-in-out infinite}
@keyframes progress{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
@media(prefers-reduced-motion:reduce){.track span{animation:none;width:100%}}
</style>
</head>
<body>
<main>
<p class="eyebrow">AGENT MULTI-REPO WORKTREE DEVELOPMENT</p>
<h1>正在进入标准开发流程</h1>
<p>如果没有自动跳转，请<a href="visualizations/standard-workflow.html">打开流程可视化页面</a>。</p>
<div class="track" aria-hidden="true"><span></span></div>
</main>
</body>
</html>
