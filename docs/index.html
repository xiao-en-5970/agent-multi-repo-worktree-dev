<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="0; url=visualizations/standard-workflow.html">
<title>正在进入 · 多仓 Worktree 标准开发流程</title>
<style>
:root{color-scheme:light;--paper:#f5f6f2;--card:#fff;--ink:#17231f;--muted:#5d6b65;--line:#d7ded8;--accent:#087a5c;--soft:#e9f4ef}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{width:min(620px,calc(100% - 32px));padding:40px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 18px 50px #17231f0d}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:700;text-transform:uppercase;margin:0 0 14px}
h1{font-size:clamp(28px,5vw,42px);line-height:1.2;letter-spacing:-.03em;margin:0 0 12px}
p{color:var(--muted);margin:10px 0}
a{color:var(--accent);text-underline-offset:3px}
.hint{margin-top:22px;padding:12px 14px;border-radius:10px;background:var(--soft);font-size:14px;color:var(--ink)}
</style>
</head>
<body>
<main>
<p class="eyebrow">Agent Multi-Repository Worktree</p>
<h1>正在进入标准开发流程</h1>
<p>访问根地址会自动跳转到目录、tmp 与 README 说明。</p>
<p class="hint">如果没有自动跳转，请<a href="visualizations/standard-workflow.html">打开流程说明页面</a>。</p>
</main>
</body>
</html>
